      name="description"
      content="Dann Mansueto is a full-stack web developer building modern, responsive applications with React, TypeScript, Laravel, and PostgreSQL."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dann Mansueto — Full-Stack Web Developer" />

      rel="stylesheet"
    />
    <title>Dann Mansueto — Full-Stack Web Developer</title>
    <script>
      (() => {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)')
        let stored = null

        try {
          stored = localStorage.getItem('dann-portfolio-theme')
        } catch {
          /* localStorage can be unavailable in private browsing */
        }

        const isDark = stored === 'dark' || (stored !== 'light' && prefersDark.matches)
        document.documentElement.classList.toggle('light', !isDark)
        document.documentElement.style.backgroundColor = isDark ? '#0c0c0f' : '#ffffff'
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', isDark ? '#0c0c0f' : '#ffffff')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
